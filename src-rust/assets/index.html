    <style>
      html, body, #root {
        background-color: #1e1e1e;
        touch-action: pan-x pan-y;
        overscroll-behavior: none;
        border: none !important;
      }
      ::-webkit-scrollbar-corner {
        background: transparent !important;
      }
      .textLayer, .textLayer span, .textLayer br, .select-text {
        -webkit-user-select: text !important;
        user-select: text !important;
      }

      /* Universal Dialog / Modal Top Priority Stacking & Interactivity */
      [data-pdfforge-modal], .pdfforge-modal-backdrop, [role="dialog"] {
        position: fixed !important;
        inset: 0 !important;
        z-index: 999999 !important;
        pointer-events: auto !important;
        isolation: isolate !important;
      }
      [data-pdfforge-modal] *, .pdfforge-modal-backdrop * {
        pointer-events: auto;
      }
      [data-pdfforge-close], button[data-pdfforge-close], [data-dismiss-modal] {
        pointer-events: auto !important;
        cursor: pointer !important;
        position: relative !important;
        z-index: 100 !important;
      }
      [data-pdfforge-close] *, button[data-pdfforge-close] *, [data-dismiss-modal] * {
        pointer-events: none !important;
      }
      .z-\[100\], .z-\[110\], .z-100 {
        z-index: 999999 !important;
      }

      /* Bundled Offline Fonts for Live Font Preview & Acrobat Text Reflow */
      @font-face { font-family: 'Noto Sans'; src: url('./fonts/NotoSans-Regular.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Noto Serif'; src: url('./fonts/NotoSerif-Regular.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Noto Sans Bengali'; src: url('./fonts/NotoSansBengali-Regular.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Noto Sans Mono'; src: url('./fonts/NotoSansMono-Regular.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Roboto'; src: url('./fonts/Roboto-Regular.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Open Sans'; src: url('./fonts/OpenSans-Regular.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Source Sans 3'; src: url('./fonts/SourceSans3-Regular.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Lato'; src: url('./fonts/Lato-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Lato'; src: url('./fonts/Lato-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Lato'; src: url('./fonts/Lato-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
      @font-face { font-family: 'Liberation Sans'; src: url('./standard_fonts/LiberationSans-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: 'Liberation Sans'; src: url('./standard_fonts/LiberationSans-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; font-display: swap; }

  <body style="background-color:#1e1e1e" class="bg-viewer text-white overflow-hidden m-0 p-0 antialiased font-sans">
    <div id="pdfforge-splash" aria-hidden="true">
      <div class="pf-splash-logo">
        <div class="pf-splash-mark">PF</div>
        <div class="pf-splash-title">PDFForge Studio</div>
      </div>
      <div class="pf-splash-track"><div class="pf-splash-bar"></div></div>
    </div>
    <div id="root" class="h-screen w-screen flex flex-col overflow-hidden"></div>
  
    <script>
      (function() {
        if (window.__pdfforgeGlobalDialogInit) return;
        window.__pdfforgeGlobalDialogInit = true;

        function closeAllModals(source) {
          try {
            if (window.qt && typeof window.qt.setState === 'function') {
              window.qt.setState({
                showAboutModal: false,
                showUpdateModal: false,
                showHelpModal: false,
                showSettingsModal: false,
                showSignatureModal: false
              });
            }
          } catch (_) {}
          try {
            window.dispatchEvent(new CustomEvent('pdfforge-close-all-modals', { detail: { source: source || 'generic' } }));
          } catch (_) {}
        }

        function isModalElement(el) {
          if (!el) return false;
          return !!(el.closest && (el.closest('[data-pdfforge-modal]') || el.closest('[role="dialog"]')));
        }

        function onGlobalPointer(ev) {
          var target = ev.target;
          if (!target) return;
          // If the modal opts into React-managed close/confirmation (e.g. Combine Files, Print), do not hijack its buttons
          var modalEl = target.closest && target.closest('[data-pdfforge-modal],[role="dialog"]');
          if (modalEl && modalEl.hasAttribute('data-pdfforge-managed')) {
            return;
          }

          // 1. Check if user clicked a designated close button or explicit cancel/close text
          var closeBtn = target.closest && target.closest('[data-pdfforge-close], button[data-pdfforge-close], [data-dismiss-modal]');
          if (!closeBtn && target.closest) {
            var btn = target.closest('button');
            if (btn && isModalElement(btn)) {
              var txt = (btn.textContent || '').trim().toLowerCase();
              if (txt === 'close' || txt === 'cancel' || txt === 'no, later') {
                closeBtn = btn;
              }
            }
          }

          if (closeBtn) {
            ev.preventDefault();
            ev.stopPropagation();
            if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
            closeAllModals('close-button');
            return;
          }

          // 2. Check if user clicked directly on the modal backdrop
          if (target.hasAttribute && target.hasAttribute('data-pdfforge-modal')) {
            ev.preventDefault();
            ev.stopPropagation();
            if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
            closeAllModals('backdrop');
            return;
          }
        }

        window.addEventListener('click', onGlobalPointer, { capture: true });
        window.addEventListener('pointerup', onGlobalPointer, { capture: true });
        window.addEventListener('mouseup', onGlobalPointer, { capture: true });

        window.addEventListener('keydown', function(ev) {
          if (ev.key === 'Escape') {
            var managed = document.querySelector('[data-pdfforge-modal][data-pdfforge-managed]');
            if (managed) return;
            var modal = document.querySelector('[data-pdfforge-modal],[role="dialog"]');
            var isModalActive = false;
            try {
              if (window.qt && window.qt.getState) {
                var s = window.qt.getState();
                isModalActive = !!(s && (s.showAboutModal || s.showUpdateModal || s.showHelpModal || s.showSettingsModal || s.showSignatureModal));
              }
            } catch (_) {}
            if (modal || isModalActive) {
              ev.preventDefault();
              ev.stopPropagation();
              if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
              closeAllModals('escape');
            }
          }
        }, { capture: true });
      })();
    </script>

  </body>
</html>
