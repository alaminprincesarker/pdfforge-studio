    <title>PDFForge</title>

    <style>
      html, body, #root {
        touch-action: pan-x pan-y pinch-zoom;
        overscroll-behavior: none;
        border: none !important;
        outline: none !important;
      }
      *:focus, *:focus-visible {
        outline: none !important;
      }
      ::-webkit-scrollbar-corner {
        background: transparent !important;
      }
      .textLayer, .textLayer span, .textLayer br, .select-text {
        -webkit-user-select: text !important;
        user-select: text !important;
      }

      /* Polished GPU-accelerated UI Animations for Open/Close Actions */
      @keyframes pdfforgeFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes pdfforgeScaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes pdfforgeSlideDown {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pdfforgeSlideInLeft {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes pdfforgeSlideInRight {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .pdfforge-modal-backdrop, [data-pdfforge-modal] {
        animation: pdfforgeFadeIn 180ms cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      }
      .pdfforge-modal-content, [data-pdfforge-modal] > div {
        animation: pdfforgeScaleIn 180ms cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      }
      .pdfforge-dropdown-menu, [role="menu"] {
        animation: pdfforgeSlideDown 140ms cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      }
      .pdfforge-sidebar-left {
        animation: pdfforgeSlideInLeft 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      }
      .pdfforge-sidebar-right {
        animation: pdfforgeSlideInRight 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      }

      /* Hover, active, focus transitions for buttons, tabs, menu items */
      button, [role="button"], a {
        transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease, opacity 140ms ease, transform 100ms ease, box-shadow 140ms ease;
      }
      button:active:not(:disabled), [role="button"]:active:not(:disabled) {
        transform: scale(0.97);
      }

      /* Respect prefers-reduced-motion */
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    
      /* Universal Dialog / Modal Top Priority Stacking & Interactivity */
      [data-pdfforge-modal], .pdfforge-modal-backdrop, [role="dialog"] {
        position: fixed !important;
        inset: 0 !important;
        z-index: 999999 !important;
        pointer-events: auto !important;
        isolation: isolate !important;
      }
      [data-pdfforge-modal] *, .pdfforge-modal-backdrop * {
        pointer-events: auto;
      }
      [data-pdfforge-close], button[data-pdfforge-close], [data-dismiss-modal] {
        pointer-events: auto !important;
        cursor: pointer !important;
        position: relative !important;
        z-index: 100 !important;
      }
      [data-pdfforge-close] *, button[data-pdfforge-close] *, [data-dismiss-modal] * {
        pointer-events: none !important;
      }
      .z-\[100\], .z-\[110\], .z-100 {
        z-index: 999999 !important;
      }

    </style>

  <body class="bg-viewer text-white overflow-hidden m-0 p-0 antialiased font-sans">
    <div id="root" class="h-screen w-screen flex flex-col overflow-hidden"></div>
  
    <script>
      (function() {
        if (window.__pdfforgeGlobalDialogInit) return;
        window.__pdfforgeGlobalDialogInit = true;

        function closeAllModals(source) {
          try {
            if (window.qt && typeof window.qt.setState === 'function') {
              window.qt.setState({
                showAboutModal: false,
                showUpdateModal: false,
                showHelpModal: false,
                showSettingsModal: false,
                showSignatureModal: false
              });
            }
          } catch (_) {}
          try {
            window.dispatchEvent(new CustomEvent('pdfforge-close-all-modals', { detail: { source: source || 'generic' } }));
          } catch (_) {}
        }

        function isModalElement(el) {
          if (!el) return false;
          return !!(el.closest && (el.closest('[data-pdfforge-modal]') || el.closest('[role="dialog"]')));
        }

        function onGlobalPointer(ev) {
          var target = ev.target;
          if (!target) return;

          // 1. Check if user clicked a designated close button or cross symbol
          var closeBtn = target.closest && target.closest('[data-pdfforge-close], button[data-pdfforge-close], [data-dismiss-modal]');
          if (!closeBtn && target.closest) {
            var btn = target.closest('button');
            if (btn && isModalElement(btn)) {
              var txt = (btn.textContent || '').trim().toLowerCase();
              if (txt === 'close' || txt === 'cancel' || txt === 'no, later' || txt === 'discard changes') {
                closeBtn = btn;
              } else if (btn.querySelector('svg') && (btn.closest('.justify-between') || btn.classList.contains('cursor-pointer'))) {
                // Header X icon
                closeBtn = btn;
              }
            }
          }

          if (closeBtn) {
            ev.preventDefault();
            ev.stopPropagation();
            if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
            closeAllModals('close-button');
            return;
          }

          // 2. Check if user clicked directly on the modal backdrop
          if (target.hasAttribute && target.hasAttribute('data-pdfforge-modal')) {
            ev.preventDefault();
            ev.stopPropagation();
            if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
            closeAllModals('backdrop');
            return;
          }
        }

        window.addEventListener('click', onGlobalPointer, { capture: true });
        window.addEventListener('pointerup', onGlobalPointer, { capture: true });
        window.addEventListener('mouseup', onGlobalPointer, { capture: true });

        window.addEventListener('keydown', function(ev) {
          if (ev.key === 'Escape') {
            var modal = document.querySelector('[data-pdfforge-modal],[role="dialog"]');
            var isModalActive = false;
            try {
              if (window.qt && window.qt.getState) {
                var s = window.qt.getState();
                isModalActive = !!(s && (s.showAboutModal || s.showUpdateModal || s.showHelpModal || s.showSettingsModal || s.showSignatureModal));
              }
            } catch (_) {}
            if (modal || isModalActive) {
              ev.preventDefault();
              ev.stopPropagation();
              if (typeof ev.stopImmediatePropagation === 'function') ev.stopImmediatePropagation();
              closeAllModals('escape');
            }
          }
        }, { capture: true });
      })();
    </script>

  </body>
