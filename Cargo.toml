[package]
name = "pdfforge"
version = "1.2.5"
edition = "2021"
description = "PDFForge - 100% Offline Desktop PDF Reader & Editor (Rust Native Edition)"
authors = ["Md. Alamin <alaminprincesarker@gmail.com>"]
license = "MIT"
repository = "https://github.com/alaminprincesarker/pdfforge-studio"
homepage = "https://alaminprincesarker.github.io/pdfforge-studio/"

[[bin]]
name = "PDFForge-Rust"
path = "src-rust/main.rs"

[dependencies]
tao = "0.30"
wry = "0.47"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rust-embed = "8.5"
mime_guess = "2.0"
http = "1.1"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
lopdf = "0.47.0"
rustybuzz = "0.20.1"
ttf-parser = "0.25.1"
fontdb = "0.24.0"
unicode-bidi = "0.3.18"
memmap2 = "0.9"
flate2 = "1.1"
crc32fast = "1.5"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

